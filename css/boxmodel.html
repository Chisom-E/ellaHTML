<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>CSS BOX MODEL</title>
    <link rel="stylesheet" href="./boxmodel.css">
</head>
<body>
<h1>CSS BOX MODEL</h1>  
<!-- The CSS box model defines how elements are structured on a webpage. Every HTML elements is considered a box consisting of four parts namely: Content, Padding, Border, Margin. 
 CONTENT: The actual text or image inside the box
 PADDING: The space between the content and the border
 BORDER: The edge surrounding the padding
 MARGIN: The space outside the border, separating elements.-->
 <div class="box"></div>
 <p class="para">God is faithful</p>
 <div class="Circle"></div>
 <!-- BOX SIZING 
  By default, the width and height exclude padding and border, making the box bigger than expected. The box-sizing property fixes this.-->
  <!-- The box shadow property in CSS is used to add shadow effects around an element's box, giving it depth or a lifted appearance. -->
   <!-- box-shadow basic syntax
    box-shadow: offset-x offset-y
    blur-radius spread-radius color -->

</body>
</html>
