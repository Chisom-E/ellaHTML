<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
</head>
<link rel="stylesheet" href="./grid.css">
<body>
    <h1>CSS GRID</h1>
    <P>CSS Grid is a powerful layout system designed to divide a page into grids, making it easy to arrange items in rows and columns. Unlike flexbox, which handles one dimensional layouts(either a row or a column)</P>
    <div class="container">
        <div class="item first">Item 1</div>
        <div class="item second">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
    </div>
    <!-- GRID AREA -->
     <h2>Grid Area</h2>
     <section class="grid-container">
        <header class="header"></header>
        <div class="sidebar"></div>
        <main class="content"></main>
        <footer class="footer"></footer>
     </section>
</body>
</html>
