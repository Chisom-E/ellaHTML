<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML LISTS</title>
</head>
<body>
    <h1>My Favourite Fruits</h1>
    <ul>
        <li>Mango</li>
        <li>Apple</li>
        <li>Orange</li>
        <li>Banana</li>
        <li>Watermelon</li>
    </ul>
    <!-- ordered list -->
    <h1>How To Make Tea</h1>
<ol>
    <li>Boil Water</li>
    <li>Add my lipton bag or tea bag</li>
    <li>Allow to steep for 5 minutes</li>
    <li>Add Milk and/or sugar if desired</li>
    <li>Stir and Serve</li>
</ol>
     
</body>
</html>
